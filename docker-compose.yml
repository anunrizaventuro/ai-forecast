services:
  web:
    build: .
    image: venturo-skeleton-next
    container_name: venturo-web
    ports:
      - '80:80'
    # Var server-only runtime (API_URL, REVALIDATE_TOKEN). NEXT_PUBLIC_* di
    # file yang sama sudah dibekukan saat build — mengubahnya butuh rebuild.
    env_file:
      - .env.prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
